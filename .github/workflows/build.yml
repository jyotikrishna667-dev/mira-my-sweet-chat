name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: |
          npm run build
          # Dono folders ensure karte hain taaki path ka koi issue na bache
          if [ -d "dist" ]; then
            cp -r dist build 2>/dev/null || true
          elif [ -d "build" ]; then
            cp -r build dist 2>/dev/null || true
          fi

      - name: Setup Capacitor Offline
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -f capacitor.config.json capacitor.config.ts
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.jyoti.mira",
            "appName": "Mira",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mira-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
